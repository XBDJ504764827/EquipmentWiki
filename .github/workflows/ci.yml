# =====================================================================
# EquipmentWiki CI
#
# 触发规则：
#   1. 任意分支 push（feature/* 开发分支）     → 代码检查
#   2. Pull Request 到 develop / main           → 完整检查
#   3. develop / main 分支 push                 → 完整检查
#
# 检查内容：
#   frontend: npm ci → type-check → lint → build
#   backend:  cargo check → test → fmt --check → clippy -D warnings
#
# 任何步骤失败都会使工作流失败，阻止合并。
# =====================================================================

name: CI

on:
  # 所有分支 push 均触发（覆盖 feature/*、develop、main）
  push:
    branches: ["*"]
  # Pull Request 到 develop / main 时触发
  pull_request:
    branches: [develop, main]

jobs:
  # ---------------- Frontend ----------------
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Node 依赖缓存（依据 frontend/package-lock.json）
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: ESLint check
        run: npm run lint

      - name: Next.js build
        run: npm run build

  # ---------------- Backend ----------------
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Rust 依赖缓存（target/ 与 Cargo.lock）
          workspaces: backend

      - name: Cargo check
        run: cargo check

      - name: Unit tests
        run: cargo test

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings
